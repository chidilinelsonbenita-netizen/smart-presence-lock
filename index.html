
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Presence Lock</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
  

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #f2f5fa;
      color: #172033;
    }

    header {
      background: #142b50;
      color: white;
      padding: 22px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    h1, h2 {
      margin-top: 0;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }

    .stat, .panel {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px #00000010;
    }

    .stat h2 {
      color: #1768d1;
      font-size: 28px;
      margin-bottom: 5px;
    }

    .panel {
      margin-bottom: 20px;
    }

    input, select, button {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: 1px solid #ccd4df;
      border-radius: 7px;
    }

    button {
      background: #1768d1;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #1053ac;
    }

    #photoPreview {
      width: 90px;
      height: 90px;
      object-fit: cover;
      border-radius: 50%;
      display: none;
      margin: 10px 0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 550px;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid #e2e6ed;
      text-align: left;
    }

    th {
      background: #edf2f9;
    }

    .table-wrap {
      overflow-x: auto;
    }

    .student-photo {
      width: 40px;
      height: 40px;
      object-fit: cover;
      border-radius: 50%;
    }
  </style>
</head>

<body>

  <header>
    <h1>Smart Presence Lock</h1>
    <p>Smart Student Attendance Management System</p>
  </header>

  <section class="stats">
    <div class="stat">
      <h2 id="studentCount">0</h2>
      Registered Students
    </div>

    <div class="stat">
      <h2 id="attendanceCount">0</h2>
      Attendance Records
    </div>

    <div class="stat">
      <h2 id="presentCount">0</h2>
      Present Today
    </div>
  </section>

  <section class="panel">
    <h2>Register Student</h2>

    <form id="studentForm">
      <input id="studentId" placeholder="Student ID" required>
      <input id="studentName" placeholder="Full Name" required>
      <input id="department" placeholder="Department" required>

      <label>Student Photograph</label>
      <input id="studentPhoto" type="file" accept="image/*" required>

      <img id="photoPreview" alt="Student photo preview">

      <button type="submit">Register Student</button>
    </form>
  </section>

  <section class="panel">
    <h2>Record Attendance</h2>

    <form id="attendanceForm">
      <select id="studentSelect" required>
        <option value="">Select Student</option>
      </select>

      <input id="eventName" placeholder="Class or Event Name" required>
      <input id="location" placeholder="Classroom Location" required>

      <button type="submit">Record Attendance</button>
    </form>
  </section>

  <section class="panel">
    <h2>Registered Students</h2>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Photo</th>
            <th>Student ID</th>
            <th>Name</th>
            <th>Department</th>
          </tr>
        </thead>
        <tbody id="studentTable"></tbody>
      </table>
    </div>
  </section>

  <section class="panel">
    <h2>Attendance Records</h2>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Student</th>
            <th>Class/Event</th>
            <th>Location</th>
            <th>Date and Time</th>
          </tr>
        </thead>
        <tbody id="attendanceTable"></tbody>
      </table>
    </div>

    <button id="exportButton" type="button">
      Export Attendance CSV
    </button>
  </section>

  <script>
    // Temporary browser storage for testing only.
    const students = [];
    const attendance = [];

    const studentForm = document.getElementById("studentForm");
    const attendanceForm = document.getElementById("attendanceForm");
    const photoInput = document.getElementById("studentPhoto");
    const photoPreview = document.getElementById("photoPreview");

    let selectedPhoto = "";

    // Preview the student's photograph.
    photoInput.addEventListener("change", function () {
      const file = this.files[0];

      if (!file) return;

      if (!file.type.startsWith("image/")) {
        alert("Please select an image.");
        return;
      }

      const reader = new FileReader();

      reader.onload = function (event) {
        selectedPhoto = event.target.result;
        photoPreview.src = selectedPhoto;
        photoPreview.style.display = "block";
      };

      reader.readAsDataURL(file);
    });

    // Register a student.
    studentForm.addEventListener("submit", function (event) {
      event.preventDefault();

      const id = document.getElementById("studentId").value.trim();
      const name = document.getElementById("studentName").value.trim();
      const department = document.getElementById("department").value.trim();

      if (!selectedPhoto) {
        alert("Please select a student photograph.");
        return;
      }

      if (students.some(student => student.id === id)) {
        alert("This student ID is already registered.");
        return;
      }

      students.push({
        id,
        name,
        department,
        photo: selectedPhoto
      });

      studentForm.reset();
      selectedPhoto = "";
      photoPreview.src = "";
      photoPreview.style.display = "none";

      updateDashboard();
      alert("Student registered successfully!");
    });

    // Record attendance.
    attendanceForm.addEventListener("submit", function (event) {
      event.preventDefault();

      const studentId = document.getElementById("studentSelect").value;
      const eventName = document.getElementById("eventName").value.trim();
      const location = document.getElementById("location").value.trim();

      const student = students.find(item => item.id === studentId);

      if (!student) {
        alert("Please select a registered student.");
        return;
      }

      const alreadyPresent = attendance.some(record =>
        record.studentId === studentId &&
        record.eventName === eventName
      );

      if (alreadyPresent) {
        alert("This student already has attendance for this event.");
        return;
      }

      attendance.push({
        studentId,
        studentName: student.name,
        eventName,
        location,
        time: new Date().toLocaleString()
      });

      attendanceForm.reset();
      updateDashboard();

      alert("Attendance recorded successfully!");
    });

    // Update dashboard and tables.
    function updateDashboard() {
      document.getElementById("studentCount").textContent = students.length;
      document.getElementById("attendanceCount").textContent = attendance.length;

      const today = new Date().toDateString();

      const presentToday = attendance.filter(record =>
        new Date(record.time).toDateString() === today
      );

      document.getElementById("presentCount").textContent =
        presentToday.length;

      const studentTable = document.getElementById("studentTable");
      const studentSelect = document.getElementById("studentSelect");

      studentTable.innerHTML = "";
      studentSelect.innerHTML = '<option value="">Select Student</option>';

      students.forEach(student => {
        studentTable.innerHTML += `
          <tr>
            <td><img class="student-photo" src="${student.photo}" alt="Student photo"></td>
            <td>${escapeHTML(student.id)}</td>
            <td>${escapeHTML(student.name)}</td>
            <td>${escapeHTML(student.department)}</td>
          </tr>
        `;

        const option = document.createElement("option");
        option.value = student.id;
        option.textContent = student.name + " - " + student.id;
        studentSelect.appendChild(option);
      });

      const attendanceTable = document.getElementById("attendanceTable");
      attendanceTable.innerHTML = "";

      attendance.forEach(record => {
        attendanceTable.innerHTML += `
          <tr>
            <td>${escapeHTML(record.studentName)}</td>
            <td>${escapeHTML(record.eventName)}</td>
            <td>${escapeHTML(record.location)}</td>
            <td>${escapeHTML(record.time)}</td>
          </tr>
        `;
      });
    }

    // Keep typed information safe when displaying it in the table.
    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[character]);
    }

    // Export attendance records as a CSV file.
    document.getElementById("exportButton").addEventListener("click", function () {
      if (attendance.length === 0) {
        alert("There are no attendance records to export.");
        return;
      }

      const rows = [
        ["Student", "Class/Event", "Location", "Date and Time"],
        ...attendance.map(record => [
          record.studentName,
          record.eventName,
          record.location,
          record.time
        ])
      ];

      const csv = rows.map(row =>
        row.map(value =>
          '"' + String(value).replace(/"/g, '""') + '"'
        ).join(",")
      ).join("\n");

      const blob = new Blob([csv], {
        type: "text/csv;charset=utf-8;"
      });

      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");

      link.href = url;
      link.download = "attendance-records.csv";
      link.click();

      URL.revokeObjectURL(url);
    });
  </script>

</body>
</html>
